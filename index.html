<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一般常識クイズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>一般常識クイズ</h1>

    <!-- クイズ画面 -->
    <section id="quiz-screen">
      <p id="progress" class="progress"></p>
      <h2 id="question" class="question"></h2>
      <div id="choices" class="choices"></div>
      <p id="feedback" class="feedback" aria-live="polite"></p>
      <button id="next-button" class="primary-button" hidden>次の問題へ</button>
    </section>

    <!-- 結果画面 -->
    <section id="result-screen" hidden>
      <h2 class="result-title">結果発表</h2>
      <p id="score" class="score"></p>
      <p id="message" class="message"></p>
      <button id="restart-button" class="primary-button">もう一度挑戦する</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
